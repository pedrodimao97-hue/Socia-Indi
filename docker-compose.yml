services:
  db:
    image: postgres:16-alpine
    container_name: social-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: social-hub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://social:social@db:5432/social?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_RTC_ICE_SERVERS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    container_name: social-hub-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
